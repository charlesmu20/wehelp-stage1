<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member</title>
    <link rel="stylesheet" href="/static/member.css">
</head>
<body>
    <header>歡迎光臨，這是會員頁</header>
    <div class="hello">{{ name }}，歡迎登入系統</div>
    <a href="/logout">登出系統</a>

    <div id="message_form">
        <h2>快來留言吧</h2>
        <div class="form-row">
            <label>內容</label>
            <input type="text" id="message_input"/>
        </div>
        <button class="submit" onclick="submitMessage()">送出</button>
    </div>

    <div id="message_list">

    </div>
    <script>
        //拿留言資料
        async function getMessage(){
            const response = await fetch("http://127.0.0.1:3000/api/message",{
                credentials: "include"
            });
            const result = await response.json();
            const messageList = document.querySelector("#message_list");
            messageList.innerHTML = "";
            result.data.forEach(message=>{
                const messageDiv = document.createElement("div");
                messageDiv.className = "message_div"
                messageDiv.textContent = `${message.name} : ${message.content}`;
                const wrapper = document.createElement("div")
                wrapper.className = "message_wrapper"
                wrapper.appendChild(messageDiv)
                if (message.self === true){
                    const deleteBtn = document.createElement("button");
                    deleteBtn.textContent = "❌"
                    deleteBtn.addEventListener("click",async function(){
                        if (confirm("確定要刪除嗎？")) {
                            const response = await fetch(`http://127.0.0.1:3000/api/message/${message.id}`,{
                                method: "DELETE",
                                credentials: "include",
                            })
                            const data = await response.json();
                            if (data.ok){
                                getMessage();
                            }
                        };
                    });
                    wrapper.appendChild(deleteBtn)
                };  
                messageList.appendChild(wrapper)
            });
        }
        //傳送留言
        async function submitMessage(){
            let messageInput= document.querySelector("#message_input").value.trim();
            if (messageInput === "") {
                return
            }
            const response = await fetch("http://127.0.0.1:3000/api/message",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                credentials: "include",
                body:JSON.stringify({
                    content: messageInput
                })
            });
            const data = await response.json();
            if (data.ok){
                document.querySelector("#message_input").value = ""
                getMessage();
            };
        };
        //載入頁面時自動執行
        getMessage();
    </script>
</body>
</html>
