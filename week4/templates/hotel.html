<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel</title>
    <style>
        header {
            text-align: center;
            font-size: 28px;
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }
        p {
            text-align: center;
            font-size: 22px;
            margin-top: 30px;
        }
        a{
            text-align: center;
            font-size: 18px;
            margin-top: 30px;
            display: block;
        }
    </style>
</head>
<body>
    <header>旅館的資訊</header>
    {% if hotel %}
    <p>{{ hotel.chinese_name }}、{{ hotel.english_name }}、{{ hotel.phone }}</p>
    {% else %}
    <p>查詢不到相關資料</p>
    {% endif %}
    <a href="/">返回首頁</a>
</body>
</html>
